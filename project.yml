# RADAR — XcodeGen project spec.   UNVERIFIED: written on a machine without XcodeGen or Xcode;
# it has only been checked to be valid YAML. Generate the project on a Mac (or in CI) with:
#
#     brew install xcodegen && xcodegen generate     →   RADAR.xcodeproj
#
# Platform requirements (docs/PLATFORM_REQUIREMENTS.md):
#   deployment target iOS 17.0 · tested on iOS 27 · built with Xcode 27.1+ · iPhone + iPad (+ iPhone Duo)
name: RADAR

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

targets:
  RADAR:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RADAR
    info:
      path: Config/RADAR-Info.plist        # generated by XcodeGen
      properties:
        CFBundleDisplayName: RADAR
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)

        # System launch screen = the same charcoal as the in-app splash (no flash).
        UILaunchScreen:
          UIColorName: LaunchBackground

        # Fonts (RadarFont.bundledFiles)
        UIAppFonts:
          - BigShouldersDisplay-Bold.ttf
          - BigShouldersDisplay-ExtraBold.ttf
          - BigShouldersDisplay-Black.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf

        # ---- Orientation & windowing -------------------------------------------------------
        # Do NOT lock orientation: on iPhone Duo the device orientation does not describe the
        # shape of the app, and a fixed orientation is called out by Apple as a layout breaker.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad: all four orientations are required for Split View / Slide Over / Stage Manager.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking: the app must NOT require full screen.
        UIRequiresFullScreen: false
        # One window per app for now (resizable, but not multi-window). Revisit with the
        # "multiple displays and scenes" guidance for iPhone Duo if ever needed.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

        # Remote feature flags (empty = not connected). See docs/FEATURE_FLAGS in the handoff.
        RADARFlagsURL: $(RADAR_FLAGS_URL)
        RADARFlagsAnonKey: $(RADAR_FLAGS_ANON_KEY)

        # Neon backend (empty = demo data only). Public endpoints; no secrets. See docs/NEON_BACKEND.md.
        RADARApiURL: $(RADAR_API_URL)
        RADARAuthURL: $(RADAR_AUTH_URL)
        RADARAuthOrigin: $(RADAR_AUTH_ORIGIN)

        # Local files keep playing with the screen locked (Step 4).
        UIBackgroundModes: [audio]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  RADARTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RADARTests          # Fixtures/*.json are copied as resources
    dependencies:
      - target: RADAR
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        PRODUCT_BUNDLE_IDENTIFIER: $(RADAR_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RADAR:
    build:
      targets:
        RADAR: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RADARTests
